# Dependabot configuration shared across ympact packages.
# Composer is checked weekly; npm and GitHub Actions monthly.
# Updates per ecosystem are grouped into a single PR.

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer-all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "monthly"
    ignore:
      # Must not be newer than engines.vscode, or the extension cannot be packaged.
      - dependency-name: "@types/vscode"
    groups:
      vscode-extension-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns: ["*"]
