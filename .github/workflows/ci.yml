name: CI

on:
  # Pull requests only: a push to main has already passed as its pull request.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, xml, curl, json, tokenizer, zip, pdo_sqlite, sqlite3
          # opcache on the CLI, as on a server, so the tests that guard against stale compiled files run.
          ini-values: memory_limit=2G, opcache.enable_cli=1
          coverage: none

      # composer.lock is not committed, so the cache follows composer.json.
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Add Flux credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.FLUX_LICENSE_USER }}" ]; then
            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_LICENSE_USER }}" "${{ secrets.FLUX_LICENSE_PASS }}"
          fi

      # A short-lived App token, scoped to the private packages composer.json names.
      - id: packages
        shell: bash
        run: .github/scripts/composer-package-repos.sh >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v2
        id: app-token
        if: steps.packages.outputs.list != ''
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.packages.outputs.list }}

      - name: Authenticate Composer for private repositories
        if: steps.app-token.outputs.token != ''
        run: |
          composer config --auth github-oauth.github.com "${{ steps.app-token.outputs.token }}"
          composer config --global github-protocols https

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Require Laravel ${{ matrix.laravel }}
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build assets
        run: npm run build --if-present

      # The Browser suite runs in the Pest run below, so Playwright is installed first.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Pest
        run: vendor/bin/pest --ci --parallel

      - name: JavaScript tests
        run: npm test --if-present

  # Flux and Blade Icons are optional: the package must boot and work with neither installed.
  without-optional-packages:
    name: Without Flux and Blade Icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, curl, json, tokenizer, zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Remove the optional packages
        run: composer remove --dev livewire/flux blade-ui-kit/blade-icons --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: vendor/bin/pest tests/Feature/WithoutOptionalPackagesTest.php

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Pint
        run: composer global require laravel/pint --no-interaction --no-progress

      - name: Pint
        run: ~/.composer/vendor/bin/pint --test
